name: Generate Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=FirstJohnny&show_icons=true&theme=dark&include_all_commits=true&count_private=true"
          path: profile/stats.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=FirstJohnny&layout=compact&langs_count=7&theme=dark"
          path: profile/top-langs.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Generate pin - elprimeschool
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=FirstJohnny&repo=elprimeschool&theme=dark"
          path: profile/pin-elprimeschool.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Generate pin - estagioconnect
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=FirstJohnny&repo=estagioconnect&theme=dark"
          path: profile/pin-estagioconnect.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --staged --quiet || git commit -m "Update stats cards"
          git push
